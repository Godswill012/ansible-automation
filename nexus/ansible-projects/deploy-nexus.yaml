---
# Play 1 installs the packages Nexus needs on the target server.
- name: Install java and net-tools
  hosts: nexus_server
  tasks:
    # Refresh apt metadata so package installation uses current package indexes.
    - name: Update apt repo and cache
      apt: 
        update_cache: yes
        force_apt_get: yes
        cache_valid_time: 0
        update_cache_retries: 5
        update_cache_retry_max_delay: 12
    # Nexus 3.70.1+ requires Java 17.
    - name: Install Java 17
      apt: name=openjdk-17-jre-headless
    # net-tools provides commands like netstat for later verification.
    - name: Install net-tools
      apt: name=net-tools

# Play 2 downloads Nexus and extracts it under /opt.
- name: Download and unpack Nexus installer
  hosts: nexus_server
  tasks:
    # Check whether Nexus is already installed so the archive is not unpacked twice.
    - name: Check nexus folder stats
      stat:
        path: /opt/nexus
      register: stat_result
    # Download the latest Nexus archive to the remote server.
    - name: Download Nexus
      get_url:
        url: https://download.sonatype.com/nexus/3/nexus-3.69.0-02-java17-unix.tar.gz
        dest: /opt/
      register: download_result
    # Extract the downloaded archive only when /opt/nexus does not exist yet.
    - name: Untar Nexus installer
      unarchive:
        src: "{{download_result.dest}}"
        dest: /opt/
        remote_src: yes
      when: not stat_result.stat.exists
    # Find the versioned Nexus directory created by the archive.
    - name: Find nexus folder
      find: 
        paths: /opt
        pattern: "nexus-*"
        file_type: directory
      register: find_result
    # Rename the extracted versioned folder to a stable /opt/nexus path.
    - name: Rename nexus folder
      shell: mv {{find_result.files[0].path}} /opt/nexus
      when: not stat_result.stat.exists

# Play 3 creates the dedicated nexus user and fixes ownership.
- name: Create nexus user to own nexus folder
  hosts: nexus_server
  tasks:
    # Create the group first so the nexus user can be assigned to it.
    - name: Ensure group nexus exists
      group:
        name: nexus
        state: present
    # Create the service account that will run Nexus.
    - name: Create nexus user 
      user:
        name: nexus
        group: nexus
    # Ensure the Nexus installation files belong to the nexus user.
    - name: Make nexus user owner of nexus folder
      file:
        path: /opt/nexus
        state: directory
        owner: nexus
        group: nexus
        recurse: yes
    # Ensure Nexus can write its runtime and data files under sonatype-work.
    - name: Make nexus user owner of sonatype-work folder
      file:
        path: /opt/sonatype-work
        state: directory
        owner: nexus
        group: nexus
        recurse: yes

  

# Play 4 configures Nexus to run as the nexus user and starts it.
- name: Start nexus with nexus user
  hosts: nexus_server
  become: True
  become_user: nexus
  tasks:
    # Update nexus.rc so Nexus knows which Linux user should run the process.
    - name: Create nexus.rc and set nexus user
      copy:
        dest: /opt/nexus/bin/nexus.rc
        content: 'run_as_user="nexus"'
        owner: nexus
        group: nexus
        mode: '0644'
    
    - name: Enable H2 datastore for Java 17
      lineinfile:
        path: /opt/sonatype-work/nexus3/etc/nexus.properties
        line: 'nexus.datastore.enabled=true'
        create: yes
       
    # Start the Nexus service from its bundled startup script.
    - name: Start nexus
      command: /opt/nexus/bin/nexus start

    - name: Check nexus status
      command: /opt/nexus/bin/nexus status
      register: nexus_status
      ignore_errors: yes

    - debug:
        var: nexus_status.stdout_lines

    - name: Check nexus logs
      shell: tail -50 /opt/sonatype-work/nexus3/log/nexus.log
      register: nexus_logs
      ignore_errors: yes

    - debug:
        var: nexus_logs.stdout_lines    

# Play 5 verifies that the Nexus process starts and opens its listening port.
- name: Verify nexus running
  hosts: nexus_server
  tasks:
    # Confirm the Nexus process exists.
    - name: Check with ps
      shell: ps aux | grep nexus
      register: app_status
    - debug: msg={{app_status.stdout_lines}}
    # Give Nexus time to finish booting before checking open ports.
    - name: Wait one minute
      pause:
        minutes: 1 
    # Verify Nexus is listening on the network.
    - name: Check with netstat
      shell: netstat -plnt
      register: app_status
    - debug: msg={{app_status.stdout_lines}}