---
- name: Install docker
  hosts: docker_servers
  become: yes
  tasks:
    - name: Make sure docker is installed
      yum:
        name: docker
        update_cache: yes
        state: present
    - name: start docker 
      systemd:
        name: docker
        state: started

- name: Install docker-compose
  hosts: docker_servers
  become: yes
  tasks:
    - name: create docker-compose directory
      file:
        path: /usr/local/lib/docker/cli-plugins
        state: directory
    - name: Get architecture of the remote host
      command: uname -m
      register: remote_arch
    - name: Install docker-compose
      get_url:
        url: "https://github.com/docker/compose/releases/download/v5.1.4/docker-compose-linux-{{ remote_arch.stdout }}"
        dest: /usr/local/lib/docker/cli-plugins/docker-compose
        mode: +x
     
- name: Add ec2-user to docker group  
  hosts: docker_servers
  become: yes
  tasks:
    - name: Add ec2-user to docker group
      user:
        name: ec2-user
        groups: docker
        append: yes 
    - name: Reconnect to server session
      meta: reset_connection
      
    - name: Check groups after reconnection
      command: groups
      register: user_groups
      become: no

    - debug:
        var: user_groups.stdout

    - name: Test docker access as ec2-user
      command: docker ps
      register: docker_ps
      become: no

    - debug:
        var: docker_ps.stdout_lines

- name: Start docker containers
  hosts: docker_servers
  vars_files:
    - project-vars
  tasks:
    - name: Copy docker-compose file to remote server
      copy:
        src: /mnt/c/Users/josep/bootcamp-java-mysql-project/docker-compose-full.yaml
        dest: /home/ec2-user/docker-compose.yaml
    - name: Docker login
      docker_login:
        username: godswill012
        password: "{{docker_password}}"
    - name: Start containers from compose
      community.docker.docker_compose_v2:
        project_src: /home/ec2-user
